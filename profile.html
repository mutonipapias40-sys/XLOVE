<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - XLOVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 20px;
      border: 3px solid #111;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">XLOVE</div>

  <nav>
    <a href="dashboard.html">Home</a>
    <a href="profile.html">My Profile</a>
    <a href="discover.html">Discover</a>
    <a href="messages.html">Messages</a>
    <a href="notifications.html">Notifications</a>
    <a href="settings.html">Settings</a>
  </nav>
</header>

<div class="container">

  <div class="card">

    <h1>My Profile</h1>

    <img src="xlove-logo.png" class="avatar" alt="XLOVE Profile">

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username">

    <label for="bio">Bio</label>
    <textarea id="bio" placeholder="Tell people about yourself"></textarea>

    <button onclick="saveProfile()">Save Changes</button>

    <div id="status"></div>

  </div>

</div>

<script>

const API_URL = "https://xlove-backend.onrender.com/api";

const savedUser = localStorage.getItem("xloveUser");

if (!savedUser) {
  window.location.href = "index.html";
}

let currentUser;

try {
  currentUser = JSON.parse(savedUser);
} catch (error) {
  localStorage.removeItem("xloveUser");
  window.location.href = "index.html";
}

async function loadProfile() {

  try {

    const response = await fetch(`${API_URL}/users`);

    const data = await response.json();

    const users = data.users || [];

    const user = users.find(
      u => Number(u.id) === Number(currentUser.id)
    );

    if (!user) {
      document.getElementById("status").textContent =
        "Profile not found.";
      return;
    }

    document.getElementById("username").value =
      user.username || "";

    document.getElementById("bio").value =
      user.bio || "";

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Unable to load profile.";

  }

}

async function saveProfile() {

  const username =
    document.getElementById("username").value.trim();

  const bio =
    document.getElementById("bio").value.trim();

  const status =
    document.getElementById("status");

  if (!username) {
    status.textContent = "Username is required.";
    return;
  }

  status.textContent = "Saving...";

  try {

    const response = await fetch(`${API_URL}/profile`, {

      method: "PUT",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        id: currentUser.id,
        username: username,
        bio: bio
      })

    });

    const data = await response.json();

    if (!response.ok) {
      status.textContent =
        data.message || "Unable to save profile.";
      return;
    }

    currentUser.username = username;
    currentUser.bio = bio;

    localStorage.setItem(
      "xloveUser",
      JSON.stringify(currentUser)
    );

    status.textContent =
      "Profile updated successfully!";

  } catch (error) {

    console.error(error);

    status.textContent =
      "Unable to save profile.";

  }

}

loadProfile();

</script>

</body>
</html>
