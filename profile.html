<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - XLOVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 15px;
      border: 3px solid #111;
    }

    .upload-box {
      text-align: center;
      margin-bottom: 25px;
    }

    .upload-label {
      display: inline-block;
      padding: 10px 18px;
      background: #111;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .upload-label:hover {
      background: #333;
    }

    #photoInput {
      display: none;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">XLOVE</div>

  <nav>
    <a href="dashboard.html">Home</a>
    <a href="profile.html">My Profile</a>
    <a href="discover.html">Discover</a>
    <a href="messages.html">Messages</a>
    <a href="notifications.html">Notifications</a>
    <a href="settings.html">Settings</a>
  </nav>
</header>

<div class="container">

  <div class="card">

    <h1>My Profile</h1>

    <img
      id="profilePhoto"
      src="xlove-logo.png"
      class="avatar"
      alt="Profile Photo"
    >

    <div class="upload-box">
      <label for="photoInput" class="upload-label">
        📸 Upload Profile Photo
      </label>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >
    </div>

    <label for="username">Username</label>
    <input
      type="text"
      id="username"
      placeholder="Enter username"
    >

    <label for="bio">Bio</label>
    <textarea
      id="bio"
      placeholder="Tell people about yourself"
    ></textarea>

    <button onclick="saveProfile()">
      Save Changes
    </button>

    <div id="status"></div>

  </div>

</div>

<script>

const API_URL = "https://xlove-backend.onrender.com/api";

const savedUser = localStorage.getItem("xloveUser");

if (!savedUser) {
  window.location.href = "index.html";
}

let currentUser;

try {
  currentUser = JSON.parse(savedUser);
} catch (error) {
  localStorage.removeItem("xloveUser");
  window.location.href = "index.html";
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

  try {

    const response = await fetch(`${API_URL}/users`);

    const data = await response.json();

    const users = data.users || [];

    const user = users.find(
      u => Number(u.id) === Number(currentUser.id)
    );

    if (!user) {

      document.getElementById("status").textContent =
        "Profile not found.";

      return;
    }

    document.getElementById("username").value =
      user.username || "";

    document.getElementById("bio").value =
      user.bio || "";


    /* Load saved photo */

    const savedPhoto = localStorage.getItem(
      `xlove-profile-photo-${currentUser.id}`
    );

    if (savedPhoto) {

      document.getElementById("profilePhoto").src =
        savedPhoto;

    }

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Unable to load profile.";

  }

}


/* =========================
   UPLOAD PHOTO
========================= */

document
  .getElementById("photoInput")
  .addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
      return;
    }

    if (!file.type.startsWith("image/")) {

      document.getElementById("status").textContent =
        "Please select an image.";

      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

      const imageData = e.target.result;

      document.getElementById("profilePhoto").src =
        imageData;

      localStorage.setItem(
        `xlove-profile-photo-${currentUser.id}`,
        imageData
      );

      document.getElementById("status").textContent =
        "Profile photo updated!";

    };

    reader.readAsDataURL(file);

  });


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile() {

  const username =
    document.getElementById("username").value.trim();

  const bio =
    document.getElementById("bio").value.trim();

  const status =
    document.getElementById("status");

  if (!username) {

    status.textContent =
      "Username is required.";

    return;
  }

  status.textContent = "Saving...";

  try {

    const response = await fetch(
      `${API_URL}/profile`,
      {
        method: "PUT",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          id: currentUser.id,
          username: username,
          bio: bio
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {

      status.textContent =
        data.message || "Unable to save profile.";

      return;
    }

    currentUser.username = username;
    currentUser.bio = bio;

    localStorage.setItem(
      "xloveUser",
      JSON.stringify(currentUser)
    );

    status.textContent =
      "Profile updated successfully!";

  } catch (error) {

    console.error(error);

    status.textContent =
      "Unable to save profile.";

  }

}

loadProfile();

</script>

</body>
</html>
