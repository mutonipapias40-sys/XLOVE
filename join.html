<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join XLOVE</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff, #fff0f6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .logo span {
      color: #ff2d75;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #111827;
    }

    .intro {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ff2d75;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: #ff2d75;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e91e63;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .login {
      text-align: center;
      margin-top: 25px;
      color: #6b7280;
    }

    .login a {
      color: #ff2d75;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">X<span>LOVE</span></div>

    <h1>Create your account</h1>

    <p class="intro">
      Join the XLOVE community and discover new people,
      interests and communities.
    </p>

    <form id="registerForm">

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Choose a username"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
      >

      <label for="confirm">Confirm Password</label>
      <input
        type="password"
        id="confirm"
        placeholder="Confirm your password"
        required
      >

      <button type="submit" id="registerButton">
        Create Account
      </button>

      <p id="message" class="message"></p>

    </form>

    <p class="login">
      Already have an account?
      <a href="login.html">Log in</a>
    </p>

    <a class="back" href="index.html">
      ← Back to XLOVE
    </a>

  </div>

  <script>
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const registerButton = document.getElementById("registerButton");

    registerForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      message.textContent = "";
      message.style.color = "";

      if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        message.style.color = "#dc2626";
        return;
      }

      registerButton.disabled = true;
      registerButton.textContent = "Creating account...";

      try {
        const response = await fetch(
          "https://xlove-backend.onrender.com/api/register",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username: username,
              email: email,
              password: password
            })
          }
        );

        const data = await response.json();

        if (response.ok) {
          message.textContent = "Account created successfully!";
          message.style.color = "#16a34a";

          registerForm.reset();

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);

        } else {
          message.textContent = data.message || "Registration failed.";
          message.style.color = "#dc2626";
        }

      } catch (error) {
        console.error(error);

        message.textContent =
          "Unable to connect to the server. Please try again.";

        message.style.color = "#dc2626";

      } finally {
        registerButton.disabled = false;
        registerButton.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
