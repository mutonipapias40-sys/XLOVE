<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover - XLOVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1000px;
      margin: 35px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    #profiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .profile-card {
      background: white;
      border-radius: 15px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .profile-photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #111;
      margin-bottom: 15px;
    }

    .username {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .bio {
      color: #666;
      min-height: 40px;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .view-button {
      display: inline-block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .view-button:hover {
      background: #333;
    }

    .message {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">XLOVE</div>

  <nav>
    <a href="dashboard.html">Home</a>
    <a href="profile.html">My Profile</a>
    <a href="discover.html">Discover</a>
    <a href="messages.html">Messages</a>
    <a href="notifications.html">Notifications</a>
    <a href="settings.html">Settings</a>
  </nav>
</header>

<div class="container">

  <h1>Discover</h1>

  <div id="profiles">
    <div class="message">Loading profiles...</div>
  </div>

</div>

<script>

const API_URL = "https://xlove-backend.onrender.com/api";

const savedUser = localStorage.getItem("xloveUser");

let currentUser = null;

if (savedUser) {
  try {
    currentUser = JSON.parse(savedUser);
  } catch (error) {
    currentUser = null;
  }
}


/* =========================
   GET PROFILE PHOTO
========================= */

function getProfilePhoto(userId) {

  const savedPhoto = localStorage.getItem(
    `xlove-profile-photo-${userId}`
  );

  if (savedPhoto) {
    return savedPhoto;
  }

  return "xlove-logo.png";
}


/* =========================
   LOAD USERS
========================= */

async function loadUsers() {

  const profilesContainer =
    document.getElementById("profiles");

  try {

    const response =
      await fetch(`${API_URL}/users`);

    if (!response.ok) {
      throw new Error("Unable to load users");
    }

    const data =
      await response.json();

    const users =
      data.users || [];

    profilesContainer.innerHTML = "";

    if (users.length === 0) {

      profilesContainer.innerHTML =
        '<div class="message">No profiles available yet.</div>';

      return;
    }


    users.forEach(user => {

      const card =
        document.createElement("div");

      card.className =
        "profile-card";

      const photo =
        getProfilePhoto(user.id);

      card.innerHTML = `

        <img
          src="${photo}"
          class="profile-photo"
          alt="Profile Photo"
        >

        <div class="username">
          ${escapeHtml(user.username || "User")}
        </div>

        <div class="bio">
          ${escapeHtml(user.bio || "No bio yet.")}
        </div>

        <a
          class="view-button"
          href="profile-view.html?id=${user.id}"
        >
          View Profile
        </a>

      `;

      profilesContainer.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    profilesContainer.innerHTML =
      '<div class="message">Unable to load profiles. Please try again later.</div>';

  }

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


loadUsers();

</script>

</body>
</html>
