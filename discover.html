        * {

        }

            flex-wrap: wrap;
        }

        .logo {
            font-size: 30px;

            color: #ff2d75;
        }

        nav {
            display: flex;
            gap: 20px;

            justify-content: center;

        nav a {
            text-decoration: none;

            font-weight: bold;

        }

        nav a:hover {
            color: #ff2d75;

        .logout {
            border: none;

        main {

            align-items: center;
            justify-content: center;

        }

<body>

    <header>

        <div class="logo">XLOVE</div>

        <nav>
            <a href="dashboard.html">Home</a>
            <a href="profile.html">My Profile</a>
            <a href="discover.html">Discover</a>
            <a href="messages.html">Messages</a>
            <a href="notifications.html">Notifications</a>
            <a href="settings.html">Settings</a>
        </nav>

        <button class="logout" onclick="logout()">
            Log Out
        </button>

    </header>

    <main>

        <div class="title">
            <h1>Discover</h1>
            <p>Explore profiles on XLOVE.</p>
        </div>

        <div id="profiles" class="profiles">
            <div class="status">
                Loading profiles...
            </div>
        </div>

    </main>

    <script>

        async function loadUsers() {

            const profiles =
                document.getElementById("profiles");

            try {

                const response = await fetch(
                    "https://xlove-backend.onrender.com/api/users"
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Unable to load users."
                    );
                }

                profiles.innerHTML = "";

                if (!data.users || data.users.length === 0) {

                    profiles.innerHTML = `
                        <div class="status">
                            No profiles available yet.
                        </div>
                    `;

                    return;
                }

                data.users.forEach(user => {

                    const username =
                        user.username || "User";

                    const firstLetter =
                        username.charAt(0).toUpperCase();

                    const bio =
                        user.bio || "No bio yet.";

                    const card = document.createElement("div");

                    card.className = "profile-card";

                    card.innerHTML = `
                        <div class="avatar">
                            ${firstLetter}
                        </div>

                        <h2>
                            ${username}
                        </h2>

                        <p>
                            ${bio}
                        </p>
                    `;

                    profiles.appendChild(card);
                });

            } catch (error) {

                console.error(error);

                profiles.innerHTML = `
                    <div class="status error">
                        Unable to load profiles.
                        Please try again.
                    </div>
                `;
            }
        }

        function logout() {

            localStorage.removeItem("xloveUser");

            window.location.href = "index.html";
        }

        loadUsers();

    </script>

</body>
</html>
