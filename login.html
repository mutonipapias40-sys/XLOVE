<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - XLOVE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111, #ff2d75);
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #ff2d75;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff2d75;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e52265;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .join {
            text-align: center;
            margin-top: 20px;
        }

        .join a {
            color: #ff2d75;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">XLOVE</div>

        <p class="subtitle">Welcome back ❤️</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" id="loginButton">
                Log In
            </button>

            <p id="message" class="message"></p>

        </form>

        <div class="join">
            Don't have an account?
            <a href="join.html">Join XLOVE</a>
        </div>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "";
            message.style.color = "";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch(
                    "https://xlove-backend.onrender.com/api/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    message.textContent = "Login successful!";
                    message.style.color = "#16a34a";

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);

                } else {
                    message.textContent =
                        data.message || "Login failed.";

                    message.style.color = "#dc2626";
                }

            } catch (error) {
                console.error(error);

                message.textContent =
                    "Unable to connect to the server. Please try again.";

                message.style.color = "#dc2626";

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Log In";
            }
        });
    </script>

</body>
</html>
