<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - XLOVE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff, #fff0f6);
        }

        header {
            background: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            flex-wrap: wrap;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #ff2d75;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            text-decoration: none;
            color: #374151;
            font-weight: bold;
            font-size: 14px;
        }

        nav a:hover {
            color: #ff2d75;
        }

        .logout {
            border: none;
            background: #ff2d75;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        main {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .profile-box {
            background: white;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            background: #ff2d75;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .username {
            color: #111827;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .bio {
            color: #6b7280;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .profile-info {
            border-top: 1px solid #eee;
            padding-top: 25px;
            margin-top: 10px;
        }

        .profile-info p {
            color: #374151;
            margin: 10px 0;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .like-button,
        .message-button {
            border: none;
            padding: 13px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .like-button {
            background: #fff0f6;
            color: #ff2d75;
            border: 2px solid #ff2d75;
        }

        .like-button:hover {
            background: #ff2d75;
            color: white;
        }

        .like-button.liked {
            background: #ff2d75;
            color: white;
        }

        .like-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message-button {
            background: #ff2d75;
            color: white;
        }

        .message-button:hover {
            background: #e91e63;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #ff2d75;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #e91e63;
        }

        .status {
            text-align: center;
            color: #6b7280;
            padding: 40px;
            font-size: 16px;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 550px) {

            header {
                justify-content: center;
            }

            nav {
                width: 100%;
            }

            .profile-box {
                padding: 30px 20px;
            }

            .username {
                font-size: 26px;
            }

            .actions {
                flex-direction: column;
            }

            .like-button,
            .message-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">XLOVE</div>

    <nav>
        <a href="dashboard.html">Home</a>
        <a href="profile.html">My Profile</a>
        <a href="discover.html">Discover</a>
        <a href="messages.html">Messages</a>
        <a href="notifications.html">Notifications</a>
        <a href="settings.html">Settings</a>
    </nav>

    <button class="logout" onclick="logout()">
        Log Out
    </button>

</header>

<main>

    <div id="profile">

        <div class="status">
            Loading profile...
        </div>

    </div>

</main>

<script>

const API_URL =
    "https://xlove-backend.onrender.com/api";


// =====================================================
// LOAD PROFILE
// =====================================================

async function loadProfile() {

    const profile =
        document.getElementById("profile");

    try {

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const userId =
            urlParams.get("id");

        if (!userId) {

            profile.innerHTML = `
                <div class="status error">
                    Profile ID is missing.
                </div>
            `;

            return;
        }

        const response =
            await fetch(
                API_URL + "/users"
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load users."
            );

        }

        const users =
            data.users || [];

        const user =
            users.find(
                item =>
                    String(item.id) ===
                    String(userId)
            );

        if (!user) {

            profile.innerHTML = `
                <div class="status error">
                    Profile not found.
                </div>
            `;

            return;
        }

        const username =
            user.username || "User";

        const bio =
            user.bio || "No bio yet.";

        profile.innerHTML = `

            <div class="profile-box">

                <div class="avatar">

                    <img
                        src="xlove-logo.png"
                        alt="XLOVE Profile"
                    >

                </div>

                <h1 class="username">
                    ${username}
                </h1>

                <p class="bio">
                    ${bio}
                </p>

                <div class="profile-info">

                    <p>
                        <strong>Username:</strong>
                        ${username}
                    </p>

                    <p>
                        <strong>Profile ID:</strong>
                        ${user.id}
                    </p>

                </div>

                <div class="actions">

                    <button
                        class="like-button"
                        id="likeButton"
                        onclick="toggleLike(${user.id})"
                    >
                        ❤️ Like
                    </button>

                    <a
                        href="messages.html?id=${user.id}"
                        class="message-button"
                    >
                        💬 Message
                    </a>

                </div>

                <a
                    href="discover.html"
                    class="back-button"
                >
                    ← Back to Discover
                </a>

            </div>

        `;

        await setupLike(user.id);

    } catch (error) {

        console.error(error);

        profile.innerHTML = `

            <div class="status error">

                Unable to load this profile.

                <br><br>

                Please try again later.

            </div>

        `;

    }

}


// =====================================================
// CHECK LIKE FROM DATABASE
// =====================================================

async function setupLike(userId) {

    const currentUser =
        JSON.parse(
            localStorage.getItem("xloveUser")
        );

    const button =
        document.getElementById(
            "likeButton"
        );

    if (!button) {
        return;
    }

    // User ntabwo yinjiye
    if (!currentUser) {

        button.innerHTML =
            "❤️ Like";

        return;

    }

    // Ntukemere ko umuntu yi-like
    // profile ye bwite

    if (
        Number(currentUser.id) ===
        Number(userId)
    ) {

        button.disabled = true;

        button.innerHTML =
            "❤️ Your Profile";

        return;

    }

    try {

        const response =
            await fetch(
                API_URL +
                "/likes/check" +
                "?liker_id=" +
                encodeURIComponent(
                    currentUser.id
                ) +
                "&liked_user_id=" +
                encodeURIComponent(
                    userId
                )
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to check like."
            );

        }

        if (data.liked === true) {

            button.classList.add(
                "liked"
            );

            button.innerHTML =
                "❤️ Liked";

        } else {

            button.classList.remove(
                "liked"
            );

            button.innerHTML =
                "❤️ Like";

        }

    } catch (error) {

        console.error(
            "Check like error:",
            error
        );

    }

}


// =====================================================
// TOGGLE LIKE
// =====================================================

async function toggleLike(userId) {

    const currentUser =
        JSON.parse(
            localStorage.getItem("xloveUser")
        );

    const button =
        document.getElementById(
            "likeButton"
        );

    if (!currentUser) {

        alert(
            "Please log in first."
        );

        return;

    }

    if (
        Number(currentUser.id) ===
        Number(userId)
    ) {

        return;

    }

    button.disabled = true;

    const alreadyLiked =
        button.classList.contains(
            "liked"
        );

    try {

        let response;

        if (alreadyLiked) {

            // REMOVE LIKE

            response =
                await fetch(
                    API_URL + "/likes",
                    {
                        method: "DELETE",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            liker_id:
                                currentUser.id,

                            liked_user_id:
                                userId
                        })
                    }
                );

        } else {

            // ADD LIKE

            response =
                await fetch(
                    API_URL + "/likes",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            liker_id:
                                currentUser.id,

                            liked_user_id:
                                userId
                        })
                    }
                );

        }

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to update like."
            );

        }

        if (data.liked === true) {

            button.classList.add(
                "liked"
            );

            button.innerHTML =
                "❤️ Liked";

        } else {

            button.classList.remove(
                "liked"
            );

            button.innerHTML =
                "❤️ Like";

        }

    } catch (error) {

        console.error(
            "Like error:",
            error
        );

        alert(
            error.message ||
            "Unable to update like."
        );

    } finally {

        button.disabled = false;

    }

}


// =====================================================
// LOGOUT
// =====================================================

function logout() {

    localStorage.removeItem(
        "xloveUser"
    );

    window.location.href =
        "index.html";

}


// =====================================================
// START
// =====================================================

loadProfile();

</script>

</body>
</html>
