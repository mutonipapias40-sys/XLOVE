```html
<!DOCTYPE html>

            padding: 0;

        nav a {

        .logout {

</head>

<body>

    <header>

        <div class="logo">XLOVE</div>

        <nav>
            <a href="dashboard.html">Home</a>
            <a href="profile.html">My Profile</a>
            <a href="discover.html">Discover</a>
            <a href="messages.html">Messages</a>
            <a href="notifications.html">Notifications</a>
            <a href="settings.html">Settings</a>
        </nav>

        <button class="logout" onclick="logout()">
            Log Out
        </button>

    </header>

    <main>

        <div id="profile">
            <div class="status">
                Loading profile...
            </div>
        </div>

    </main>

    <script>

        async function loadProfile() {

            const profile =
                document.getElementById("profile");

            try {

                const urlParams =
                    new URLSearchParams(window.location.search);

                const userId =
                    urlParams.get("id");

                if (!userId) {

                    profile.innerHTML = `
                        <div class="status error">
                            Profile ID is missing.
                        </div>
                    `;

                    return;
                }

                const response = await fetch(
                    `https://xlove-backend.onrender.com/api/users/${userId}`
                );

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message || "Unable to load profile."
                    );
                }

                const user =
                    data.user || data;

                const username =
                    user.username || "User";

                const firstLetter =
                    username.charAt(0).toUpperCase();

                const bio =
                    user.bio || "No bio yet.";

                profile.innerHTML = `

                    <div class="profile-box">

                        <div class="avatar">
                            ${firstLetter}
                        </div>

                        <h1 class="username">
                            ${username}
                        </h1>

                        <p class="bio">
                            ${bio}
                        </p>

                        <div class="profile-info">

                            <p>
                                <strong>Username:</strong>
                                ${username}
                            </p>

                            <p>
                                <strong>Profile ID:</strong>
                                ${user.id || userId}
                            </p>

                        </div>

                        <a
                            href="discover.html"
                            class="back-button"
                        >
                            ← Back to Discover
                        </a>

                    </div>

                `;

            } catch (error) {

                console.error(error);

                profile.innerHTML = `

                    <div class="status error">

                        Unable to load this profile.

                        <br><br>

                        Please try again later.

                    </div>

                `;
            }
        }

        function logout() {

            localStorage.removeItem("xloveUser");

            window.location.href = "index.html";
        }

        loadProfile();

    </script>

</body>
</html>
