<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XLOVE - Register</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .logo {
      text-align: center;
      color: #ff3366;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #ff3366;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #ff3366;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">XLOVE</div>

  <h2>Create Account</h2>

  <form id="registerForm">

    <input
      type="text"
      id="username"
      placeholder="Username"
      required
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Register
    </button>

  </form>

  <div id="message"></div>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>

const API_URL =
  "https://xlove-backend.onrender.com/api";

const form =
  document.getElementById("registerForm");

const message =
  document.getElementById("message");


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const username =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  message.textContent =
    "Creating account...";


  try {

    const response =
      await fetch(`${API_URL}/register`, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          username,
          email,
          password
        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      message.textContent =
        data.error || "Registration failed.";

      return;
    }


    message.textContent =
      "Account created successfully!";


    form.reset();


    setTimeout(() => {

      window.location.href =
        "login.html";

    }, 1200);


  } catch (error) {

    console.error(error);

    message.textContent =
      "Unable to connect to server.";

  }

});

</script>

</body>
</html>
