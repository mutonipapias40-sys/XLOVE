<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XLOVE Messages</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .back {
      color: white;
      text-decoration: none;
    }

    .chat-container {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    .chat-header {
      padding: 18px;
      border-bottom: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
    }

    #messages {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      background: #fafafa;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 15px;
      max-width: 75%;
      word-wrap: break-word;
    }

    .mine {
      margin-left: auto;
      background: #111;
      color: white;
    }

    .theirs {
      margin-right: auto;
      background: #e5e5e5;
      color: #222;
    }

    .time {
      display: block;
      font-size: 11px;
      margin-top: 5px;
      opacity: 0.7;
    }

    .send-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #sendButton {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    #status {
      padding: 10px 15px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>💬 XLOVE</h1>
  <a class="back" href="discover.html">← Back</a>
</header>

<div class="chat-container">

  <div class="chat-header" id="chatTitle">
    Loading...
  </div>

  <div id="status"></div>

  <div id="messages"></div>

  <div class="send-area">
    <input
      type="text"
      id="messageInput"
      placeholder="Write a message..."
      autocomplete="off"
    >

    <button id="sendButton">
      Send
    </button>
  </div>

</div>

<script>
  const API_URL = "https://xlove-backend.onrender.com/api";

  const currentUser = JSON.parse(
    localStorage.getItem("xloveUser") || "null"
  );

  const params = new URLSearchParams(window.location.search);
  const targetUserId = params.get("id");

  const chatTitle = document.getElementById("chatTitle");
  const messagesBox = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const statusBox = document.getElementById("status");

  if (!currentUser) {
    window.location.href = "login.html";
  }

  if (!targetUserId) {
    chatTitle.textContent = "No user selected";
    sendButton.disabled = true;
  }

  async function loadChat() {
    try {
      statusBox.textContent = "Loading...";

      const usersResponse = await fetch(`${API_URL}/users`);

      if (!usersResponse.ok) {
        throw new Error("Unable to load users.");
      }

      const usersData = await usersResponse.json();

      const targetUser = usersData.users.find(
        user => Number(user.id) === Number(targetUserId)
      );

      if (!targetUser) {
        throw new Error("User not found.");
      }

      chatTitle.textContent = `💬 ${targetUser.username}`;

      const messagesResponse = await fetch(
        `${API_URL}/messages?user1=${currentUser.id}&user2=${targetUserId}`
      );

      if (!messagesResponse.ok) {
        throw new Error("Unable to load messages.");
      }

      const messagesData = await messagesResponse.json();

      messagesBox.innerHTML = "";

      if (messagesData.messages.length === 0) {
        messagesBox.innerHTML =
          "<p style='text-align:center;color:#777;'>No messages yet.</p>";
      } else {
        messagesData.messages.forEach(message => {
          addMessage(message);
        });
      }

      statusBox.textContent = "";

      scrollToBottom();

    } catch (error) {
      console.error(error);
      statusBox.textContent = error.message;
    }
  }

  function addMessage(message) {
    const div = document.createElement("div");

    div.className =
      "message " +
      (Number(message.sender_id) === Number(currentUser.id)
        ? "mine"
        : "theirs");

    const text = document.createElement("div");
    text.textContent = message.message;

    const time = document.createElement("span");
    time.className = "time";

    const date = new Date(message.created_at);

    time.textContent = date.toLocaleString();

    div.appendChild(text);
    div.appendChild(time);

    messagesBox.appendChild(div);
  }

  async function sendMessage() {
    const text = messageInput.value.trim();

    if (!text) {
      return;
    }

    sendButton.disabled = true;
    statusBox.textContent = "Sending...";

    try {
      const response = await fetch(`${API_URL}/messages`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          sender_id: Number(currentUser.id),
          receiver_id: Number(targetUserId),
          message: text
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.message || "Unable to send message."
        );
      }

      messageInput.value = "";

      statusBox.textContent = "";

      await loadChat();

    } catch (error) {
      console.error(error);
      statusBox.textContent = error.message;
    }

    sendButton.disabled = false;
    messageInput.focus();
  }

  function scrollToBottom() {
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  sendButton.addEventListener("click", sendMessage);

  messageInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  loadChat();
</script>

</body>
</html>
