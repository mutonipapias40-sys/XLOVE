<header>

    <div class="logo">XLOVE</div>

    <nav>
        <a href="dashboard.html">Home</a>
        <a href="profile.html">My Profile</a>
        <a href="discover.html">Discover</a>
        <a href="messages.html">Messages</a>
        <a href="notifications.html">Notifications</a>
        <a href="settings.html">Settings</a>
    </nav>

    <button class="logout" onclick="logout()">
        Log Out
    </button>

</header>

<main>

    <a href="discover.html" class="back-button">
        ← Back to Discover
    </a>

    <div class="chat-card">

        <div class="chat-header">

            <div class="avatar">
                <img
                    src="xlove-logo.png"
                    alt="Profile"
                >
            </div>

            <div class="chat-user">

                <h1 id="chatUsername">
                    Loading...
                </h1>

                <div class="online">
                    ● Available
                </div>

            </div>

        </div>

        <div
            class="chat-body"
            id="chatBody"
        >

            <div class="welcome" id="welcomeMessage">
                Start a conversation with this person. 💬
            </div>

        </div>

        <div class="chat-input-area">

            <input
                type="text"
                id="messageInput"
                class="chat-input"
                placeholder="Write a message..."
                autocomplete="off"
            >

            <button
                class="send-button"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </div>

</main>

<script>

    let currentUserId = null;

    async function loadChatUser() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        currentUserId =
            params.get("id");

        if (!currentUserId) {

            document.getElementById(
                "chatUsername"
            ).textContent = "User";

            return;
        }

        try {

            const response = await fetch(
                "https://xlove-backend.onrender.com/api/users"
            );

            const data =
                await response.json();

            const users =
                data.users || [];

            const user =
                users.find(
                    item =>
                        String(item.id) ===
                        String(currentUserId)
                );

            if (user) {

                document.getElementById(
                    "chatUsername"
                ).textContent =
                    user.username || "User";
            }

        } catch (error) {

            console.error(error);

            document.getElementById(
                "chatUsername"
            ).textContent = "User";
        }

        loadMessages();
    }


    function getStorageKey() {

        return "xlove-chat-" + currentUserId;
    }


    function loadMessages() {

        const saved =
            localStorage.getItem(
                getStorageKey()
            );

        if (!saved) {
            return;
        }

        const messages =
            JSON.parse(saved);

        const chatBody =
            document.getElementById("chatBody");

        const welcome =
            document.getElementById(
                "welcomeMessage"
            );

        if (welcome) {
            welcome.remove();
        }

        messages.forEach(
            message => {

                addMessageToScreen(
                    message.text,
                    message.type
                );

            }
        );

        chatBody.scrollTop =
            chatBody.scrollHeight;
    }


    function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );

        const text =
            input.value.trim();

        if (!text) {
            return;
        }

        const message = {
            text: text,
            type: "sent"
        };

        const storageKey =
            getStorageKey();

        const saved =
            localStorage.getItem(
                storageKey
            );

        const messages =
            saved
                ? JSON.parse(saved)
                : [];

        messages.push(message);

        localStorage.setItem(
            storageKey,
            JSON.stringify(messages)
        );

        addMessageToScreen(
            text,
            "sent"
        );

        input.value = "";

        const chatBody =
            document.getElementById(
                "chatBody"
            );

        chatBody.scrollTop =
            chatBody.scrollHeight;
    }


    function addMessageToScreen(
        text,
        type
    ) {

        const chatBody =
            document.getElementById(
                "chatBody"
            );

        const welcome =
            document.getElementById(
                "welcomeMessage"
            );

        if (welcome) {
            welcome.remove();
        }

        const message =
            document.createElement("div");

        message.className =
            "message " + type;

        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        bubble.textContent = text;

        message.appendChild(bubble);

        chatBody.appendChild(message);
    }


    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );


    function logout() {

        localStorage.removeItem(
            "xloveUser"
        );

        window.location.href =
            "index.html";
    }


    loadChatUser();

</script>
