<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XLOVE - Messages</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #ff3366;
      font-size: 24px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .title {
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px;
      border-bottom: 1px solid #eee;
      text-decoration: none;
      color: #222;
    }

    .conversation:hover {
      background: #f8f8f8;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff3366;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .username {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .last-message {
      color: #777;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time {
      color: #999;
      font-size: 12px;
    }

    .loading,
    .empty,
    .error {
      padding: 40px 20px;
      text-align: center;
    }

    .error {
      color: #d00000;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">XLOVE</div>
  <a href="discover.html" class="back">← Discover</a>
</header>

<div class="container">

  <div class="title">
    Messages
  </div>

  <div id="conversationList">
    <div class="loading">
      Loading conversations...
    </div>
  </div>

</div>

<script>

const API_URL =
  "https://xlove-backend.onrender.com/api";

const currentUser =
  JSON.parse(localStorage.getItem("xloveUser"));

const list =
  document.getElementById("conversationList");


if (!currentUser || !currentUser.id) {

  list.innerHTML = `
    <div class="error">
      Please login first.
    </div>
  `;

} else {

  loadConversations();

}


async function loadConversations() {

  try {

    const usersResponse =
      await fetch(`${API_URL}/users`);

    if (!usersResponse.ok) {
      throw new Error("Users request failed");
    }

    const usersData =
      await usersResponse.json();

    const users =
      usersData.users || [];


    const conversations = [];


    for (const user of users) {

      const response =
        await fetch(
          `${API_URL}/messages?user1=${currentUser.id}&user2=${user.id}`
        );


      if (!response.ok) {
        continue;
      }


      const data =
        await response.json();

      const messages =
        data.messages || [];


      if (messages.length > 0) {

        const lastMessage =
          messages[messages.length - 1];


        conversations.push({

          userId: user.id,

          username: user.username,

          message: lastMessage.message,

          createdAt: lastMessage.created_at

        });

      }

    }


    if (conversations.length === 0) {

      list.innerHTML = `
        <div class="empty">
          <h3>No messages yet</h3>
          <p>Your conversations will appear here.</p>
        </div>
      `;

      return;
    }


    conversations.sort(
      (a, b) =>
        new Date(b.createdAt) -
        new Date(a.createdAt)
    );


    list.innerHTML = "";


    conversations.forEach(conversation => {

      const item =
        document.createElement("a");

      item.className =
        "conversation";

      item.href =
        `messages.html?id=${conversation.userId}`;


      item.innerHTML = `

        <img
          class="avatar"
          src="xlove-logo.png"
          alt="XLOVE"
        >

        <div class="info">

          <div class="username">
            ${escapeHTML(conversation.username)}
          </div>

          <div class="last-message">
            ${escapeHTML(conversation.message)}
          </div>

        </div>

        <div class="time">
          ${formatTime(conversation.createdAt)}
        </div>

      `;


      list.appendChild(item);

    });


  } catch (error) {

    console.error("Conversation error:", error);

    list.innerHTML = `
      <div class="error">
        Unable to load conversations.
        <br><br>
        Please try again later.
      </div>
    `;

  }

}


function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


function formatTime(dateString) {

  const date =
    new Date(dateString);

  if (isNaN(date)) {
    return "";
  }

  return date.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });

}

</script>

</body>
</html>
