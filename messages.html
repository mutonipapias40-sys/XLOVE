<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XLOVE - Messages</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ff3366;
    }

    .back {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .title {
      padding: 20px;
      border-bottom: 1px solid #eee;
      font-size: 24px;
      font-weight: bold;
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px;
      border-bottom: 1px solid #eee;
      text-decoration: none;
      color: #222;
      transition: background 0.2s;
    }

    .conversation:hover {
      background: #f8f8f8;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff3366;
    }

    .info {
      flex: 1;
    }

    .username {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .last-message {
      color: #777;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 500px;
    }

    .time {
      color: #999;
      font-size: 12px;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #777;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: #777;
    }

    .error {
      padding: 30px;
      text-align: center;
      color: #d00;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">XLOVE</div>
  <a href="discover.html" class="back">← Discover</a>
</header>

<div class="container">

  <div class="title">
    Messages
  </div>

  <div id="conversationList">
    <div class="loading">
      Loading conversations...
    </div>
  </div>

</div>

<script>

const API_URL = "https://xlove-backend.onrender.com/api";

const currentUser = JSON.parse(
  localStorage.getItem("xloveUser")
);

const conversationList =
  document.getElementById("conversationList");


/* Check login */

if (!currentUser || !currentUser.id) {

  conversationList.innerHTML = `
    <div class="error">
      Please login first.
    </div>
  `;

} else {

  loadConversations();

}


/* Load conversations */

async function loadConversations() {

  try {

    const response = await fetch(
      `${API_URL}/conversations/${currentUser.id}`
    );

    if (!response.ok) {
      throw new Error("Failed to load conversations");
    }

    const messages = await response.json();

    if (!messages || messages.length === 0) {

      conversationList.innerHTML = `
        <div class="empty">
          <h3>No messages yet</h3>
          <p>Your conversations will appear here.</p>
        </div>
      `;

      return;
    }


    /* Group messages by other user */

    const conversations = {};

    messages.forEach(message => {

      const otherUserId =
        Number(message.sender_id) === Number(currentUser.id)
          ? Number(message.receiver_id)
          : Number(message.sender_id);

      const otherUsername =
        Number(message.sender_id) === Number(currentUser.id)
          ? message.receiver_username
          : message.sender_username;

      if (!conversations[otherUserId]) {

        conversations[otherUserId] = {
          userId: otherUserId,
          username: otherUsername,
          lastMessage: message.message,
          createdAt: message.created_at
        };

      } else {

        conversations[otherUserId].lastMessage =
          message.message;

        conversations[otherUserId].createdAt =
          message.created_at;

      }

    });


    /* Newest conversation first */

    const conversationArray =
      Object.values(conversations).sort(
        (a, b) =>
          new Date(b.createdAt) -
          new Date(a.createdAt)
      );


    conversationList.innerHTML = "";


    conversationArray.forEach(conversation => {

      const item =
        document.createElement("a");

      item.className = "conversation";

      item.href =
        `messages.html?id=${conversation.userId}`;


      item.innerHTML = `

        <img
          class="avatar"
          src="xlove-logo.png"
          alt="XLOVE"
        >

        <div class="info">

          <div class="username">
            ${escapeHTML(conversation.username || "User")}
          </div>

          <div class="last-message">
            ${escapeHTML(conversation.lastMessage || "")}
          </div>

        </div>

        <div class="time">
          ${formatTime(conversation.createdAt)}
        </div>

      `;


      conversationList.appendChild(item);

    });


  } catch (error) {

    console.error(error);

    conversationList.innerHTML = `
      <div class="error">
        Unable to load conversations.
        <br><br>
        Please try again later.
      </div>
    `;

  }

}


/* Prevent HTML injection */

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* Format message time */

function formatTime(dateString) {

  const date = new Date(dateString);

  if (isNaN(date)) {
    return "";
  }

  return date.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });

}

</script>

</body>
</html>
