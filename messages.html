<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XLOVE - Messages</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #ff3366;
      font-size: 24px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .title {
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px;
      border-bottom: 1px solid #eee;
      text-decoration: none;
      color: #222;
    }

    .conversation:hover {
      background: #f8f8f8;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff3366;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .username {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .last-message {
      color: #777;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time {
      color: #999;
      font-size: 12px;
    }

    .loading,
    .empty,
    .error {
      padding: 40px 20px;
      text-align: center;
    }

    .error {
      color: #d00000;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
    }

    .chat-header .avatar {
      width: 45px;
      height: 45px;
    }

    .chat-name {
      font-size: 18px;
      font-weight: bold;
    }

    .messages {
      padding: 20px;
      min-height: 300px;
      max-height: 500px;
      overflow-y: auto;
    }

    .message-row {
      display: flex;
      margin-bottom: 12px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      background: #eee;
      word-wrap: break-word;
    }

    .mine .bubble {
      background: #ff3366;
      color: white;
    }

    .message-time {
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.7;
      text-align: right;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #eee;
    }

    .composer input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    .composer button {
      border: none;
      background: #ff3366;
      color: white;
      padding: 0 22px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .composer button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">XLOVE</div>
  <a href="discover.html" class="back">← Discover</a>
</header>

<div class="container">

  <div class="title" id="pageTitle">
    Messages
  </div>

  <div id="content">
    <div class="loading">
      Loading...
    </div>
  </div>

</div>

<script>

const API_URL =
  "https://xlove-backend.onrender.com/api";

const currentUser =
  JSON.parse(localStorage.getItem("xloveUser"));

const content =
  document.getElementById("content");

const params =
  new URLSearchParams(window.location.search);

const targetId =
  params.get("id");


if (!currentUser || !currentUser.id) {

  content.innerHTML = `
    <div class="error">
      Please login first.
    </div>
  `;

} else if (targetId) {

  loadChat(Number(targetId));

} else {

  loadConversations();

}


/* =========================
   CONVERSATION
========================= */

async function loadChat(userId) {

  try {

    const usersResponse =
      await fetch(`${API_URL}/users`);

    const usersData =
      await usersResponse.json();

    const users =
      usersData.users || [];

    const targetUser =
      users.find(user => Number(user.id) === Number(userId));

    if (!targetUser) {

      content.innerHTML = `
        <div class="error">
          User not found.
        </div>
      `;

      return;
    }

    document.getElementById("pageTitle").textContent =
      "Conversation";

    content.innerHTML = `

      <div class="chat-header">

        <img
          class="avatar"
          src="xlove-logo.png"
          alt="XLOVE"
        >

        <div class="chat-name">
          ${escapeHTML(targetUser.username)}
        </div>

      </div>

      <div
        class="messages"
        id="messagesBox"
      >
        <div class="loading">
          Loading messages...
        </div>
      </div>

      <form
        class="composer"
        id="messageForm"
      >

        <input
          type="text"
          id="messageInput"
          placeholder="Write a message..."
          autocomplete="off"
          required
        >

        <button
          type="submit"
          id="sendButton"
        >
          Send
        </button>

      </form>
    `;

    await loadMessages(userId);

    document
      .getElementById("messageForm")
      .addEventListener(
        "submit",
        function(event) {
          event.preventDefault();
          sendMessage(userId);
        }
      );

  } catch (error) {

    console.error(error);

    content.innerHTML = `
      <div class="error">
        Unable to load conversation.
        <br><br>
        Please try again.
      </div>
    `;

  }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(userId) {

  const box =
    document.getElementById("messagesBox");

  try {

    const response =
      await fetch(
        `${API_URL}/messages?user1=${currentUser.id}&user2=${userId}`
      );

    if (!response.ok) {
      throw new Error("Messages request failed");
    }

    const data =
      await response.json();

    const messages =
      data.messages || [];

    if (messages.length === 0) {

      box.innerHTML = `
        <div class="empty">
          No messages yet.
          <br>
          Start the conversation.
        </div>
      `;

      return;
    }

    box.innerHTML = "";

    messages.forEach(message => {

      const mine =
        Number(message.sender_id) === Number(currentUser.id);

      const row =
        document.createElement("div");

      row.className =
        mine
          ? "message-row mine"
          : "message-row";

      row.innerHTML = `

        <div class="bubble">

          ${escapeHTML(message.message)}

          <div class="message-time">
            ${formatTime(message.created_at)}
          </div>

        </div>

      `;

      box.appendChild(row);

    });

    box.scrollTop =
      box.scrollHeight;

  } catch (error) {

    console.error(error);

    box.innerHTML = `
      <div class="error">
        Unable to load messages.
      </div>
    `;

  }

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(userId) {

  const input =
    document.getElementById("messageInput");

  const button =
    document.getElementById("sendButton");

  const message =
    input.value.trim();

  if (!message) {
    return;
  }

  button.disabled = true;
  button.textContent = "Sending...";

  try {

    const response =
      await fetch(`${API_URL}/messages`, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          sender_id: Number(currentUser.id),

          receiver_id: Number(userId),

          message: message

        })

      });

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.message || "Message failed"
      );

    }

    input.value = "";

    await loadMessages(userId);

  } catch (error) {

    console.error(error);

    alert(
      "Message could not be sent: " +
      error.message
    );

  }

  button.disabled = false;
  button.textContent = "Send";

}


/* =========================
   CONVERSATION LIST
========================= */

async function loadConversations() {

  try {

    const usersResponse =
      await fetch(`${API_URL}/users`);

    const usersData =
      await usersResponse.json();

    const users =
      usersData.users || [];

    const conversations = [];

    for (const user of users) {

      if (
        Number(user.id) ===
        Number(currentUser.id)
      ) {
        continue;
      }

      const response =
        await fetch(
          `${API_URL}/messages?user1=${currentUser.id}&user2=${user.id}`
        );

      if (!response.ok) {
        continue;
      }

      const data =
        await response.json();

      const messages =
        data.messages || [];

      if (messages.length > 0) {

        const lastMessage =
          messages[messages.length - 1];

        conversations.push({

          userId: user.id,

          username: user.username,

          message: lastMessage.message,

          createdAt: lastMessage.created_at

        });

      }

    }

    if (conversations.length === 0) {

      content.innerHTML = `
        <div class="empty">
          <h3>No messages yet</h3>
          <p>Your conversations will appear here.</p>
        </div>
      `;

      return;
    }

    conversations.sort(
      (a, b) =>
        new Date(b.createdAt) -
        new Date(a.createdAt)
    );

    content.innerHTML = "";

    conversations.forEach(conversation => {

      const item =
        document.createElement("a");

      item.className =
        "conversation";

      item.href =
        `messages.html?id=${conversation.userId}`;

      item.innerHTML = `

        <img
          class="avatar"
          src="xlove-logo.png"
          alt="XLOVE"
        >

        <div class="info">

          <div class="username">
            ${escapeHTML(conversation.username)}
          </div>

          <div class="last-message">
            ${escapeHTML(conversation.message)}
          </div>

        </div>

        <div class="time">
          ${formatTime(conversation.createdAt)}
        </div>

      `;

      content.appendChild(item);

    });

  } catch (error) {

    console.error(error);

    content.innerHTML = `
      <div class="error">
        Unable to load conversations.
        <br><br>
        Please try again later.
      </div>
    `;

  }

}


/* =========================
   HELPERS
========================= */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


function formatTime(dateString) {

  const date =
    new Date(dateString);

  if (isNaN(date)) {
    return "";
  }

  return date.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });

}

</script>

</body>
</html>
