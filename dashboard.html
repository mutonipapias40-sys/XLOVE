```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLOVE Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff, #fff0f6);
        }

        header {
            background: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            flex-wrap: wrap;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #ff2d75;
        }

        .dashboard-nav {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .dashboard-nav a {
            text-decoration: none;
            color: #374151;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .dashboard-nav a:hover {
            color: #ff2d75;
        }

        .logout {
            border: none;
            background: #ff2d75;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout:hover {
            background: #e52265;
        }

        main {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        .welcome {
            background: white;
            padding: 45px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h1 {
            color: #111827;
            margin-bottom: 15px;
        }

        .username {
            color: #ff2d75;
        }

        p {
            color: #6b7280;
            font-size: 17px;
            line-height: 1.6;
        }

        .profile-button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #ff2d75;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.2s;
        }

        .profile-button:hover {
            background: #e52265;
        }

        @media (max-width: 700px) {
            header {
                justify-content: center;
            }

            .dashboard-nav {
                order: 3;
                width: 100%;
            }

            main {
                margin: 30px auto;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">XLOVE</div>

        <nav class="dashboard-nav">
            <a href="dashboard.html">Home</a>
            <a href="profile.html">My Profile</a>
            <a href="discover.html">Discover</a>
            <a href="#">Messages</a>
            <a href="#">Notifications</a>
            <a href="#">Settings</a>
        </nav>

        <button class="logout" onclick="logout()">
            Log Out
        </button>

    </header>

    <main>

        <div class="welcome">

            <h1>
                Welcome, <span id="username" class="username">User</span>! 👋
            </h1>

            <p>
                Welcome to your XLOVE dashboard.
            </p>

            <a href="profile.html" class="profile-button">
                My Profile
            </a>

        </div>

    </main>

    <script>
        const user = JSON.parse(
            localStorage.getItem("xloveUser")
        );

        if (user && user.username) {
            document.getElementById("username").textContent =
                user.username;
        }

        function logout() {
            localStorage.removeItem("xloveUser");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
```
